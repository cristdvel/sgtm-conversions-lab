<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Producto · Tienda de laboratorio</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>
<body data-page="product">
  <header><a href="index.html">Tienda de laboratorio</a> · <a href="checkout.html">Carrito</a></header>
  <main>
    <h1 id="product-name">Producto</h1>
    <p id="product-price"></p>
    <button type="button" id="add-to-cart">Añadir al carrito</button>
    <p id="cart-status" role="status"></p>
  </main>
  <div id="consent-banner" hidden>
    <p>Usamos cookies de analítica y publicidad solo si las aceptas.</p>
    <button type="button" data-consent="reject">Rechazar</button>
    <button type="button" data-consent="accept">Aceptar</button>
  </div>
</body>
</html>
